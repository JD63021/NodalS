name: Apply low-memory fast-path freeze

on:
  push:
    branches:
      - freeze/low-memory-fast-path
    paths:
      - '.github/workflows/apply-freeze-low-memory-fast-path.yml'

permissions:
  contents: write

jobs:
  apply-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/freeze_low_memory_fast_path.patch.00 \
              tools/freeze_low_memory_fast_path.patch.01 \
              tools/freeze_low_memory_fast_path.patch.02 \
              > /tmp/freeze.patch
          echo '545891c118f42fa83ac14a56b7519943ef61e7af728c1935d10e498b148ee246  /tmp/freeze.patch' | sha256sum -c -
          git apply --check /tmp/freeze.patch
      - name: Apply source freeze
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/freeze.patch
          python3 -m py_compile scripts/nodals_case.py
          grep -q 'customPressureBtApply3Fused' src/30_momentum/custom_momentum.inc
          grep -q 'customPressureBApply3ScalarExchangeFusedTraversal' src/30_momentum/custom_momentum.inc
          grep -q 'smoothSolveCustomMomentumNative3' src/30_momentum/custom_momentum.inc
          grep -q 'directSGSSmoother=PETSC_TRUE' src/45_pressure_amg/custom_pressure_amg.inc
          grep -q 'targetAggregateSize=16' src/45_pressure_amg/custom_pressure_amg.inc
          grep -q 'softMaxAggregateSize=18' src/45_pressure_amg/custom_pressure_amg.inc
      - name: Commit frozen source and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/freeze_low_memory_fast_path.patch.00 \
                 tools/freeze_low_memory_fast_path.patch.01 \
                 tools/freeze_low_memory_fast_path.patch.02 \
                 .github/workflows/apply-freeze-low-memory-fast-path.yml
          git add src/30_momentum/custom_momentum.inc \
                  src/45_pressure_amg/custom_pressure_amg.inc \
                  src/80_app/main_solver.inc \
                  scripts/nodals_case.py
          git config user.name 'NodalS freeze bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Freeze low-memory fused solver path'
          git push origin HEAD:freeze/low-memory-fast-path
